<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>身心障礙日常生活支持</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=LXGW+WenKai+TC:wght@400;700&family=Caveat:wght@600;700&family=Archivo+Black&display=swap">
<style>
/* Layout: one 1600×900 collage "board" per screen on grid paper, scroll-snapped vertically; under 820px the boards reflow into a reading column. */
:root{
  --paper:#ECEBE7; --grid:rgba(20,20,20,.055); --card:#FFFFFF; --ink:#161616; --mute:#6A6964;
  --line:#1C1C1C; --yellow:#FFC629; --yellow-soft:#FFE68F; --scrap:#F6F5F1; --shade:rgba(20,20,10,.14);
  --f-head:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","STKaiti",serif;
  --f-en:"Caveat","Comic Sans MS",cursive;
  --f-num:"Archivo Black","Arial Black",Impact,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
body:not(.mob){overflow-y:scroll}
html.snap{scroll-snap-type:y mandatory}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* ---------- slide shell ---------- */
.slide{position:relative;height:100vh;height:100dvh;scroll-snap-align:start;overflow:hidden;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--s,1));
  padding:64px 92px 58px;display:flex;flex-direction:column;gap:26px}
.hd{display:flex;flex-direction:column;gap:6px;position:relative;z-index:2}
.kick{font-family:var(--f-hand);font-size:22px;color:var(--mute);display:flex;align-items:center;gap:10px;letter-spacing:.04em}
.kick i{display:inline-block;width:34px;height:2px;background:var(--line)}
.hd h2{margin:0;font-family:var(--f-head);font-weight:900;font-size:56px;line-height:1.15;letter-spacing:.01em;text-wrap:balance}
.bd{flex:1;min-height:0;display:flex;gap:44px;position:relative;z-index:2}
.pnum{position:absolute;right:92px;bottom:22px;font-family:var(--f-en);font-size:24px;color:var(--mute);z-index:2}
mark{background:linear-gradient(transparent 52%,var(--yellow) 52%,var(--yellow) 92%,transparent 92%);color:inherit;padding:0 .08em}
b,strong{font-weight:900}

/* points */
.pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:space-evenly;gap:14px;flex:1;min-width:0}
.pts li{display:grid;grid-template-columns:30px 1fr;gap:16px;align-items:start;font-size:31px;line-height:1.45;font-weight:500}
.pts li::before{content:"";width:22px;height:22px;margin-top:.42em;border:2.5px solid var(--line);border-radius:50%;background:var(--yellow)}
.pts li .ld{display:block;font-weight:900}
.pts li .ds{display:block;font-size:.8em;color:#3a3936;font-weight:400;margin-top:2px}
.pts.dense li{font-size:27px}
.pts.dense li .ds{font-size:.82em}
.col-text{flex:1.05;min-width:0;display:flex;flex-direction:column;gap:18px}
.col-img{flex:1;min-width:0;display:grid;gap:22px;align-content:stretch}
.note{font-family:var(--f-hand);font-size:25px;line-height:1.5;background:var(--card);padding:16px 22px;border:2px solid var(--line);border-radius:3px;
  box-shadow:6px 6px 0 var(--yellow);align-self:flex-start;max-width:100%}
.note b{font-family:var(--f-body)}

/* photo cards */
.ph{position:relative;margin:0;background:var(--card);padding:10px 10px 0;box-shadow:0 10px 24px -12px var(--shade),0 1px 0 rgba(0,0,0,.05);
  display:flex;flex-direction:column;min-height:0;min-width:0;transform:rotate(var(--r,0deg))}
.ph img,.ph video{flex:1;min-height:0;width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.ph figcaption{font-family:var(--f-hand);font-size:22px;text-align:center;padding:8px 4px 10px;line-height:1.3}
.ph:not(:has(figcaption)){padding-bottom:10px}
.ph.tape::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:28px;transform:translateX(-50%) rotate(-3deg);
  background:rgba(255,214,90,.78);box-shadow:0 1px 2px rgba(0,0,0,.08);z-index:2}
.ph.cover img{object-fit:cover}
.g1{grid-template-columns:1fr}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(2,1fr);grid-template-rows:1fr 1fr}
.g4r{grid-template-columns:repeat(4,1fr)}
.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.g8{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
.g12{grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr}
.g5{grid-template-columns:repeat(5,1fr)}

/* gallery slide */
.gal{flex:1;display:grid;gap:26px;min-height:0}
.gal-wrap{flex:1;display:flex;flex-direction:column;gap:22px;min-height:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{font-size:24px;font-weight:700;padding:8px 18px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
.chip.y{background:var(--yellow)}

/* columns */
.cols{flex:1;display:grid;gap:30px;min-height:0}
.colc{background:var(--card);border:2px solid var(--line);border-radius:4px;padding:26px 28px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative}
.colc h3{margin:0;font-size:32px;font-weight:900;display:flex;align-items:center;gap:12px}
.colc h3 .tag{font-family:var(--f-en);font-size:26px;font-weight:700;color:var(--mute)}
.colc.hi{background:var(--yellow-soft)}
.colc .pts li{font-size:28px;grid-template-columns:22px 1fr;gap:12px}
.colc .pts li::before{width:16px;height:16px;border-width:2px}
.colc .ph{flex:1;max-height:300px}
.colc .pic{flex:1;min-height:0;max-height:240px;display:grid;gap:12px}
.colc .pic .ph img{max-height:190px}
.colc .pic .ph{max-height:none}

/* steps */
.steps{list-style:none;margin:0;padding:0;flex:1;display:grid;gap:22px;counter-reset:st;min-height:0}
.steps li{counter-increment:st;background:var(--card);border:2px solid var(--line);border-radius:4px;padding:22px 22px 20px;display:flex;flex-direction:column;justify-content:center;gap:10px;position:relative;min-width:0}
.steps li::before{content:counter(st);font-family:var(--f-num);font-size:30px;width:56px;height:56px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--line);display:grid;place-items:center}
.steps li b{font-size:34px;line-height:1.25}
.steps li span{font-size:25px;color:#3a3936;line-height:1.45}
.steps.chain li:not(:last-child)::after{content:"";position:absolute;right:-20px;top:50%;width:18px;height:18px;border-top:3px solid var(--line);border-right:3px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.flow{display:flex;flex-wrap:wrap;gap:10px 8px;align-items:center;font-size:24px;line-height:1.3}
.flow span{background:var(--card);border:2px solid var(--line);padding:8px 14px;border-radius:4px;font-weight:700}
.flow span.hl{background:var(--yellow)}
.flow span.dim{background:#dddcd6;color:#55544f}
.flow em{font-style:normal;font-weight:900}

/* table */
.tbl-wrap{flex:1;min-height:0;overflow:auto;display:grid;align-content:center}
table.t{border-collapse:collapse;width:100%;background:var(--card);font-size:25px;border:2.5px solid var(--line)}
.t th,.t td{border:1.5px solid #bdbbb4;padding:12px 16px;text-align:left;vertical-align:top;line-height:1.4}
.t th{background:var(--ink);color:#fff;font-weight:700}
.t td:first-child{font-weight:700;background:#f4f3ef;white-space:nowrap}
.t.cmp td,.t.cmp th{text-align:center}
.t.cmp td:first-child{text-align:left}
.t.roomy{font-size:27px}
.t.roomy th,.t.roomy td{padding:20px 20px}
.t.small{font-size:21px}
.t.tbig{font-size:32px}
.t.tbig th,.t.tbig td{padding:22px 24px}
.tgrid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:18px}
.tgrid div{background:var(--card);border:2px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.tgrid b{font-size:27px}
.tgrid span{font-size:20px;color:#3a3936;line-height:1.4}
.tgrid div:nth-child(3n+1){background:var(--yellow-soft)}
body.mob .tgrid{grid-template-columns:1fr 1fr}
body.mob .tgrid b{font-size:18px}
body.mob .tgrid span{font-size:14px}
.t.small th,.t.small td{padding:7px 12px}

/* quiz */
.quiz{flex:1;display:flex;gap:44px;min-height:0}
.qbox{flex:1.1;display:flex;flex-direction:column;justify-content:center;gap:26px;min-width:0}
.qq{font-size:44px;font-weight:900;line-height:1.35;text-wrap:balance}
.qopts{display:grid;gap:18px}
.qopt{font:inherit;font-size:32px;font-weight:700;text-align:left;display:flex;align-items:center;gap:20px;padding:18px 24px;background:var(--card);
  border:2.5px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);transition:transform .15s,box-shadow .15s}
.qopt:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--line)}
.qopt:focus-visible,.btn:focus-visible,.navb:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.qopt .k{font-family:var(--f-num);font-size:26px;width:50px;height:50px;flex:none;border-radius:50%;border:2.5px solid var(--line);display:grid;place-items:center;background:var(--paper)}
.qopt.right{background:var(--yellow)}
.qopt.right .k{background:var(--ink);color:var(--yellow)}
.qopt.wrong{opacity:.5;text-decoration:line-through}
.qwhy{font-family:var(--f-hand);font-size:28px;line-height:1.5;background:var(--card);border:2px dashed var(--line);padding:16px 22px;border-radius:4px}
.quiz:not(.done) .qwhy{visibility:hidden}
.btn{font:inherit;font-size:22px;font-weight:700;padding:10px 20px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;align-self:flex-start}
.btn:hover{background:var(--yellow)}
.qside{flex:.9;min-width:0;display:grid;gap:20px}

/* sorting game */
.sort{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:24px}
.card{font:inherit;position:relative;background:var(--card);border:2.5px solid var(--line);border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;color:var(--ink)}
.card .n{font-family:var(--f-num);font-size:26px;position:absolute;left:14px;top:10px}
.card .w{font-size:36px;font-weight:900}
.card .res{font-size:24px;font-weight:700;padding:6px 16px;border-radius:999px;border:2px solid var(--line);visibility:hidden}
.card.show .res{visibility:visible}
.card.show.a{background:var(--yellow-soft)}
.card.show.a .res{background:var(--yellow)}
.card.show.b .res{background:#dddcd6}

/* big statement */
.big{flex:1;display:flex;flex-direction:column;justify-content:center;gap:30px}
.big .q{font-size:76px;font-weight:900;line-height:1.25;text-wrap:balance}
.big .s{font-family:var(--f-hand);font-size:34px;color:#3a3936;max-width:26em;line-height:1.5}

/* links */
.links{flex:1;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:26px;min-height:0}
.lk{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;color:var(--ink);text-decoration:none;min-width:0}
.lk:hover{box-shadow:6px 6px 0 var(--yellow)}
.lk .qr{width:230px;height:230px;max-width:100%}
.links:has(.lk:nth-child(4)) .lk .qr{width:160px;height:160px}
.links:has(.lk:nth-child(4)) .lk{padding:14px;gap:6px}
.lk .qr svg{width:100%;height:100%}
.lk b{font-size:26px}
.lk span{font-size:19px;color:var(--mute);line-height:1.4;word-break:break-all}

/* bar chart */
.bars{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:10px;min-width:0}
.bar{display:grid;grid-template-columns:300px 1fr 130px;align-items:center;gap:18px;font-size:27px;font-weight:700}
.bar .tr{height:34px;background:#dcdbd5;border-radius:3px;overflow:hidden}
.bar .fl{height:100%;background:var(--ink);width:var(--w)}
.bar.hi .fl{background:var(--yellow);box-shadow:inset 0 0 0 2.5px var(--line)}
.bar .v{font-family:var(--f-num);font-size:26px;font-variant-numeric:tabular-nums;text-align:right}

/* tips board (復能20小撇步) */
.tips{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:20px;min-height:0}
.tip{background:var(--card);border:2px solid var(--line);border-radius:4px;padding:18px 22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tip h4{margin:0;font-size:28px;font-weight:900;display:inline-flex}
.tip h4 span{background:var(--yellow);padding:0 8px}
.tip ul{margin:0;padding-left:1.1em;font-size:22px;line-height:1.5;display:flex;flex-direction:column;justify-content:space-evenly;flex:1}
.tip.wide{grid-row:span 2}

/* chapter divider */
.ch .stage{padding:80px 100px;flex-direction:row;align-items:center;gap:60px}
.ch-text{flex:1.1;display:flex;flex-direction:column;gap:22px;position:relative;z-index:3}
.ch-no{font-family:var(--f-num);font-size:150px;line-height:.9;color:var(--ink);display:flex;align-items:flex-end;gap:18px}
.ch-no small{font-family:var(--f-en);font-size:44px;line-height:1.3;color:var(--mute)}
.ch-t{font-size:84px;font-weight:900;line-height:1.15;margin:0;text-wrap:balance}
.ch-d{font-family:var(--f-hand);font-size:32px;color:#3a3936;line-height:1.5;max-width:20em}
.ch-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.ch-list span{font-size:22px;font-weight:700;padding:6px 14px;background:var(--card);border:2px solid var(--line);border-radius:999px}
.ch-art{flex:1;align-self:stretch;position:relative;min-width:0}
.sun{position:absolute;border-radius:50%;background:var(--yellow);border:3px solid var(--line)}
.scrap{position:absolute;background:var(--scrap);
  background-image:linear-gradient(rgba(0,0,0,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.08) 1px,transparent 1px);background-size:22px 22px;
  clip-path:polygon(3% 6%,22% 0,48% 4%,71% 1%,97% 7%,100% 34%,96% 61%,99% 92%,74% 97%,47% 100%,20% 95%,1% 99%,4% 70%,0 38%);box-shadow:0 0 0 1px rgba(0,0,0,.05)}
.half{position:absolute;overflow:hidden;background:#fff;box-shadow:0 18px 40px -18px var(--shade)}
.half img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.35) brightness(1.06);display:block}
.half::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.42) 28%,transparent 31%);background-size:5px 5px;mix-blend-mode:multiply;opacity:.55;pointer-events:none}
.half.color img{filter:none}
.half.color::after{display:none}

/* cover */
.cv .stage{flex-direction:row;align-items:center;gap:40px;padding:80px 100px}
.cv-t{flex:1.25;display:flex;flex-direction:column;gap:28px;position:relative;z-index:3}
.cv-t .tag{font-family:var(--f-en);font-size:40px;color:var(--mute)}
.cv-t h1{margin:0;font-size:118px;font-weight:900;line-height:1.08;letter-spacing:.01em}
.cv-t h1 mark{padding:0 .06em}
.cv-t .who{display:flex;gap:16px;align-items:center;font-size:30px;font-weight:700}
.cv-t .who span{font-family:var(--f-hand);font-weight:400;color:#3a3936}
.cv-t .hint{font-family:var(--f-hand);font-size:26px;color:var(--mute);display:flex;align-items:center;gap:12px}
.cv-art{flex:1;align-self:stretch;position:relative}


/* speaker */
.spk{flex:1;display:grid;grid-template-columns:420px 1fr;gap:56px;min-height:0;align-items:center}
.spk-l{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:26px}
.spk-ph{position:relative;width:360px;height:360px;margin-left:20px}
.spk-ph .sun{width:250px;height:250px;right:-34px;top:-30px}
.spk-ph .half{inset:0;transform:rotate(-2.5deg)}
.spk-ph .half img{filter:grayscale(1) contrast(1.15) brightness(1.04)}
.spk-fb{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:12px 16px;color:var(--ink);text-decoration:none;box-shadow:5px 5px 0 var(--yellow);transform:rotate(1deg);width:400px}
.spk-fb .qr{width:110px;height:110px;flex:none}
.spk-fb .qr svg{width:100%;height:100%}
.spk-fb b{font-size:22px;display:block}
.spk-fb small{font-size:17px;color:var(--mute);line-height:1.4;display:block;margin-top:4px}
.spk-r{display:flex;flex-direction:column;gap:22px;min-width:0;height:100%;justify-content:center}
.spk-name{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.spk-name b{font-size:64px;font-weight:900;line-height:1}
.spk-name span{font-size:30px;font-weight:700;background:var(--yellow);padding:2px 12px}
.spk-name i{font-family:var(--f-en);font-style:normal;font-size:34px;color:var(--mute)}
.roles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.roles li{display:grid;grid-template-columns:22px 1fr;gap:14px;font-size:27px;line-height:1.4;align-items:start}
.roles li::before{content:"";width:16px;height:16px;margin-top:.45em;border:2.5px solid var(--line);border-radius:50%;background:var(--yellow)}
body.mob .spk{grid-template-columns:1fr;gap:20px}
body.mob .spk-ph{width:240px;height:240px;margin:10px auto}
body.mob .spk-ph .sun{width:160px;height:160px}
body.mob .spk-fb{width:auto;transform:none}
body.mob .spk-name b{font-size:36px}
body.mob .spk-name span{font-size:18px}
body.mob .roles li{font-size:17px}

/* toc slide */
.toc-grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);grid-auto-flow:column;gap:12px 30px;min-height:0}
.toc-grid a{display:flex;align-items:center;gap:16px;text-decoration:none;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:4px;padding:8px 18px;font-size:25px;font-weight:700;min-width:0}
.toc-grid a:hover{background:var(--yellow)}
.toc-grid a i{font-style:normal;font-family:var(--f-num);font-size:24px;width:44px;flex:none}
.toc-grid a small{margin-left:auto;font-family:var(--f-en);font-size:22px;color:var(--mute);font-weight:600}

/* doodles */
.dd{position:absolute;pointer-events:none;z-index:1;color:var(--line);fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dd .y{fill:var(--yellow);stroke:var(--line)}
.on .dd path,.on .dd circle,.on .dd polyline{stroke-dasharray:1200;animation:draw 1.6s ease-out both}
@keyframes draw{from{stroke-dashoffset:1200}to{stroke-dashoffset:0}}
.on .hd,.on .bd>*,.on .ch-text,.on .cv-t{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.on .bd>*:nth-child(2){animation-delay:.08s}
.on .bd>*:nth-child(3){animation-delay:.16s}
@keyframes up{from{transform:translateY(16px);opacity:.15}to{transform:none;opacity:1}}

/* ---------- chrome: progress, nav, toc drawer ---------- */
.prog{position:fixed;left:0;top:0;height:5px;background:var(--yellow);width:0;z-index:50;box-shadow:inset 0 -1.5px 0 var(--line);transition:width .3s}
.topbar{position:fixed;left:0;top:0;z-index:40;display:flex;gap:10px;align-items:center;
  padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0 max(16px,env(safe-area-inset-left,0px))}
.navb{font:inherit;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.navb:hover{background:var(--yellow)}
.navb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}

  return `<figure class="ph ${cls}" style="--r:${r}deg"><img src="${o.src}" alt="${o.c||''}" loading="lazy" decoding="async">${o.c?`<figcaption>${o.c}</figcaption>`:''}</figure>`;}
function gridCls(n,g){if(g)return g;return n<=1?'g1':n==2?'g2':n==3?'g3':n==4?'g4':n<=6?'g6':n<=8?'g8':'g12';}
function ptsHTML(a,dense){return `<ul class="pts${dense?' dense':''}">${a.map(x=>`<li><div>${x}</div></li>`).join('')}</ul>`;}
function chips(a,y){return a?`<div class="chips">${a.map(c=>`<span class="chip${y?' y':''}">${c}</span>`).join('')}</div>`:'';}
function note(n){return n?`<div class="note">${n}</div>`:'';}
function qr(url){try{const q=qrcode(0,'M');q.addData(unescape(encodeURIComponent(url)));q.make();return q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){return ''}}
function linkRow(ls){return ls?`<div class="chips">${ls.map(l=>`<a class="chip y" href="${l[1]}" target="_blank" rel="noopener">${l[0]} ↗</a>`).join('')}</div>`:'';}
const DD=['d-loop','d-check','d-burst','d-arrow','d-star','d-wave'];
function doodles(i){const a=DD[i%6],b=DD[(i*7+3)%6];
  const p1=[[1380,30,180,90],[30,780,150,90],[1420,760,130,110],[40,20,120,100]][i%4];
  return `<svg class="dd" style="left:${p1[0]}px;top:${p1[1]}px;width:${p1[2]}px;height:${p1[3]}px" aria-hidden="true"><use href="#${a}"/></svg>`;}

/* ---------- interactions ---------- */
deck.addEventListener('click',e=>{
  const o=e.target.closest('.qopt');
  if(o){const q=o.closest('.quiz');const ans=q.dataset.ans.split(',').map(Number);
    q.querySelectorAll('.qopt').forEach(b=>{const i=+b.dataset.i;b.classList.toggle('right',ans.includes(i));b.classList.toggle('wrong',!ans.includes(i)&&b===o);});
    q.querySelectorAll('.qa-tag').forEach(t=>t.hidden=false);q.classList.add('done');return;}
  const sh=e.target.closest('.qshow');
  if(sh){const q=sh.closest('.quiz');const ans=q.dataset.ans.split(',').map(Number);q.querySelectorAll('.qopt').forEach(b=>b.classList.toggle('right',ans.includes(+b.dataset.i)));q.querySelectorAll('.qa-tag').forEach(t=>t.hidden=false);q.classList.add('done');return;}
  const c=e.target.closest('.card');if(c){c.classList.toggle('show');return;}
  const sa=e.target.closest('.sall');if(sa){sa.closest('.bd').querySelectorAll('.card').forEach(x=>x.classList.add('show'));}
});

/* ---------- scaling & mode ---------- */
const root=document.documentElement;
function fit(){const w=innerWidth,h=innerHeight;const mob=w<820||h<480;document.body.classList.toggle('mob',mob);root.classList.toggle('snap',!mob);
  root.style.setProperty('--s',Math.min(w/1600,h/900));}
addEventListener('resize',fit);fit();

/* ---------- nav ---------- */
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
function go(i){i=Math.max(0,Math.min(slides.length-1,i));slides[i].scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.5){const i=+e.target.dataset.i;setCur(i);}});},{threshold:[.5,.75]});
slides.forEach(s=>io.observe(s));
function setCur(i){if(slides[cur])slides[cur].classList.remove('on');cur=i;const s=slides[i];s.classList.add('on');
  $('#cnt').textContent=(i+1)+' / '+slides.length;$('#prog').style.width=((i+1)/slides.length*100)+'%';
  const ch=CH[SL[i].ch];$('#cur').textContent=ch.no?String(ch.no).padStart(2,'0')+' '+ch.t:'';
  if(history.replaceState)history.replaceState(null,'','#p'+(i+1));markToc();
  s.querySelectorAll('video').forEach(()=>{});slides.forEach((x,k)=>{if(k!==i)x.querySelectorAll('video').forEach(v=>{if(!v.paused)v.pause();});});}
$('#upBtn').onclick=()=>go(cur-1);$('#dnBtn').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;const k=e.key;
  if(['ArrowDown','PageDown',' ','ArrowRight'].includes(k)){if(k===' '&&e.target.closest('button,video'))return;e.preventDefault();go(cur+1);}
  else if(['ArrowUp','PageUp','ArrowLeft'].includes(k)){e.preventDefault();go(cur-1);}
  else if(k==='Home'){e.preventDefault();go(0);}else if(k==='End'){e.preventDefault();go(slides.length-1);}
  else if(k==='t'||k==='T'){toggleToc();}else if(k==='Escape'){toggleToc(false);}});

function titleOf(s){return s.type==='speaker'?'講師介紹':s.type==='cover'?'封面':s.type==='end'?'感謝聆聽':s.type==='ch'?'章節：'+s.t:s.t;}
tocl.innerHTML=CH.map((c,ci)=>{const end=ci<CH.length-1?CH[ci+1].first:SL.length;const items=[];for(let i=c.first;i<end;i++)items.push(i);
  return `<details data-c="${ci}"><summary><i>${String(c.no).padStart(2,'0')}</i>${c.t}<small>${items.length} 頁</small></summary><ol>${items.map(i=>`<li><a href="#p${i+1}" data-i="${i}"><span>${i+1}</span>${titleOf(SL[i]).replace(/<[^>]+>/g,'')}</a></li>`).join('')}</ol></details>`;}).join('');
function markToc(){tocl.querySelectorAll('a.now').forEach(a=>a.classList.remove('now'));const a=tocl.querySelector(`a[data-i="${cur}"]`);if(a)a.classList.add('now');
  tocl.querySelectorAll('details').forEach(d=>d.classList.toggle('now',+d.dataset.c===SL[cur].ch));}
function toggleToc(open){const o=open===undefined?drawer.hidden:open;drawer.hidden=!o;$('#tocBtn').setAttribute('aria-expanded',o);
  if(o){tocl.querySelectorAll('details').forEach(d=>d.open=+d.dataset.c===SL[cur].ch);const a=tocl.querySelector('a.now');if(a)a.scrollIntoView({block:'center'});$('#tocQ').focus({preventScroll:true});}}
$('#tocBtn').onclick=()=>toggleToc();$('#tocClose').onclick=()=>toggleToc(false);$('#scrim').onclick=()=>toggleToc(false);
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#p"]');if(!a)return;e.preventDefault();const i=+a.getAttribute('href').slice(2)-1;toggleToc(false);go(i);});
$('#tocQ').addEventListener('input',e=>{const q=e.target.value.trim();tocl.querySelectorAll('details').forEach(d=>{let any=false;d.querySelectorAll('li').forEach(li=>{const m=!q||li.textContent.includes(q);li.hidden=!m;if(m)any=true;});d.hidden=!any&&!!q;d.open=!!q&&any||(!q&&+d.dataset.c===SL[cur].ch);});});

/* start at hash */
const h=location.hash.match(/^#p(\d+)$/);if(h){const i=+h[1]-1;if(slides[i]){root.style.scrollBehavior='auto';slides[i].scrollIntoView();root.style.scrollBehavior='';}}
setCur(h&&slides[+h[1]-1]?+h[1]-1:0);
</script>

</body></html>
